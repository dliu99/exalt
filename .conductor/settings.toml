"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
run_mode = "concurrent"

[scripts.run.app]
command = "bun .conductor/dev.ts"
default = true
available_in = ["local"]
icon = "play"

[scripts.run.backend]
command = "bun .conductor/dev.ts backend"
available_in = ["local"]
icon = "server"

[scripts.run.frontend]
command = "bun .conductor/dev.ts frontend"
available_in = ["local"]
icon = "globe"
